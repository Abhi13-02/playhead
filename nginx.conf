events {
    worker_connections 4096;
}

http {
    access_log off;

    server {
        listen 8080;

        location / {
            # Docker's embedded DNS server. Compose registers every replica of a service under the
            # service name, so "app" resolves to one A record per running replica.
            #
            # The valid=2s and the $backend variable together are the whole trick. nginx normally
            # resolves an upstream *once*, at startup, and caches it forever — so replicas started
            # later by `--scale` would never receive traffic, and the pre-scaling this phase exists
            # to demonstrate would silently do nothing. Naming the host through a variable defers
            # resolution to request time, and valid=2s caps how long a stale answer is reused.
            resolver 127.0.0.11 valid=2s ipv6=off;
            set $backend "app";
            proxy_pass http://$backend:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # A replica that is still starting should take a request out of rotation rather than
            # fail it: under a pre-scale the newest replicas are by definition the least ready.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
        }
    }
}
