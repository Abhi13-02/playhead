# nginx defaults to a single worker process. On a multi-core host that leaves the load balancer
# running on one core while everything behind it scales, so the proxy becomes the ceiling.
worker_processes auto;

events {
    # Each proxied request consumes TWO slots from this budget: one for the client connection and
    # one for the upstream connection. 4096 therefore capped the whole system at roughly 2,000
    # concurrent requests per worker, and with a single worker that was the system limit — nginx
    # logged "4096 worker_connections are not enough while connecting to upstream" thousands of
    # times per run while the app replicas behind it still had capacity. Measurements taken at that
    # point were reading this number rather than anything about the service.
    worker_connections 16384;
}

http {
    access_log off;

    # ---------------------------------------------------------------------------------------
    # Fleet-wide admission control (D-035, supersedes D-031).
    #
    # These limits belong here, not in the application, because the number they encode describes
    # the *system's* capacity — and nginx is the only component of which exactly one exists. The
    # app's own token buckets are per-instance state: scaling to N replicas gave the fleet N copies
    # of a system-wide number, silently multiplying the limit by the replica count and switching
    # admission control off exactly when capacity was added (D-031 measured shedding fall from
    # 23.88%/18.33% to 0.00% at 3 replicas). One door cannot multiply.
    #
    # The key is $server_name — a constant — deliberately. The usual $binary_remote_addr keys a
    # bucket per client IP, which is a *fairness* limit; this is a *capacity* limit, so every
    # request shares one bucket regardless of origin.
    #
    # burst == rate mirrors the application TokenBucket's semantics (capacity == refill rate): a
    # full bucket absorbs one second of traffic instantly, then admits at the sustained rate.
    # nodelay serves burst requests immediately instead of queueing them — queueing under a surge
    # converts a fast 429 into a slow timeout, which is the failure this whole layer exists to
    # avoid.
    #
    # Rates are the phase-2 measured system ceiling (BENCHMARKS.md): ~10,000 req/s total, split
    # 80/15/5 across the tiers by priority.
    # ---------------------------------------------------------------------------------------
    limit_req_zone $server_name zone=playback_write:10m rate=8000r/s;
    limit_req_zone $server_name zone=resume_read:10m    rate=1500r/s;
    limit_req_zone $server_name zone=browse_read:10m    rate=500r/s;

    # 429, not nginx's default 503: a shed request is "you are over your rate", not "the server is
    # broken". Matches what the application returns so clients see one contract at either layer.
    limit_req_status 429;

    server {
        listen 8080;

        # Not cosmetic, and not optional. The limit_req_zone keys above are $server_name, and nginx
        # skips rate limiting entirely for any request whose key evaluates to the empty string. With
        # no server_name set, $server_name is empty, every key was empty, and all three zones were
        # silently inert — a verification run measured 1,488 r/s sailing past a 500 r/s browse limit
        # with zero "limiting requests" entries in the error log. A rate limiter that silently does
        # nothing is worse than none, because the metrics look healthy.
        server_name playhead;

        # Docker's embedded DNS server. Compose registers every replica of a service under the
        # service name, so "app" resolves to one A record per running replica.
        #
        # The valid=2s and the $backend variable together are the whole trick. nginx normally
        # resolves an upstream *once*, at startup, and caches it forever — so replicas started
        # later by `--scale` would never receive traffic, and the pre-scaling this phase exists
        # to demonstrate would silently do nothing. Naming the host through a variable defers
        # resolution to request time, and valid=2s caps how long a stale answer is reused.
        resolver 127.0.0.11 valid=2s ipv6=off;
        set $backend "app";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # A replica that is still starting should take a request out of rotation rather than
        # fail it: under a pre-scale the newest replicas are by definition the least ready.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;

        # `always` is required: without it add_header applies only to 2xx/3xx, and the header would
        # be missing from precisely the 429s that need it.
        add_header Retry-After 1 always;

        # PLAYBACK_WRITE — a lost heartbeat is unrecoverable, so this tier gets 80% of the budget
        # and is the last to run dry.
        location = /v1/playback/heartbeat {
            limit_req zone=playback_write burst=8000 nodelay;
            proxy_pass http://$backend:8080;
        }

        # RESUME_READ — a failed resume is retried by the client and the answer is still in Redis.
        location ^~ /v1/playback/resume/ {
            limit_req zone=resume_read burst=1500 nodelay;
            proxy_pass http://$backend:8080;
        }

        # BROWSE_READ — shed first. Losing these costs a stale browse row or a missing top-20 list.
        location = /v1/playback/continue-watching {
            limit_req zone=browse_read burst=500 nodelay;
            proxy_pass http://$backend:8080;
        }

        location ^~ /v1/browse/ {
            limit_req zone=browse_read burst=500 nodelay;
            proxy_pass http://$backend:8080;
        }

        # Everything else — /actuator/*, /v1/events/* — deliberately unlimited. The scaling
        # controller polls /v1/events/upcoming, and rate-limiting the control plane during a surge
        # would stop the pre-scale from firing at the one moment it matters.
        location / {
            proxy_pass http://$backend:8080;
        }
    }
}
