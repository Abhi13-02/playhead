spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/playhead
    username: playhead
    password: playhead
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 50ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # The heartbeats topic carries exactly one type, so the consumer deserializes to it
        # directly and ignores the type header the producer embeds. That decouples the consumer
        # from the producer's class name and package (DECISIONS.md D-026).
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.playhead.domain.Heartbeat
    listener:
      ack-mode: manual

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-components: always
  metrics:
    distribution:
      # Real percentile buckets for http.server.requests (read/write latency panels) and the Kafka
      # producer/consumer timers, so Grafana can compute p50/p95/p99 with histogram_quantile
      # instead of only ever seeing the JVM-local percentiles reported at scrape time.
      percentiles-histogram:
        http.server.requests: true
        kafka.producer.request.latency: true
      slo:
        http.server.requests: 10ms,50ms,100ms,500ms,1s
  health:
    # Redis is a best-effort read-path accelerator, not a dependency (DECISIONS.md D-025/D-027).
    # Its auto-configured health contributor was pulling the whole service's /actuator/health to
    # DOWN whenever Redis was killed, even though reads keep working from Postgres — a load
    # balancer would then evict a node that is still serving traffic correctly. Redis liveness is
    # observed through the cache metrics and the circuit breaker's logged state instead.
    redis:
      enabled: false
