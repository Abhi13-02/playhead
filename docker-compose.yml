services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: playhead-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners, deliberately. A container reaching the broker by the compose service
      # name and a process on the host reaching it on localhost need *different* advertised
      # addresses: whatever the broker advertises is what the client reconnects to, so a container
      # told "localhost:9092" would loop back to itself. PLAINTEXT keeps the original host-facing
      # address unchanged (bootRun still works exactly as before); INTERNAL is the in-network one.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    mem_limit: 1.5g

  redis:
    image: redis:7
    container_name: playhead-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 384m

  # Reports Redis's own view of itself — ops/sec, memory, connected clients, and whether it is
  # answering at all. The app's Lettuce metrics describe the *client's* experience; this describes
  # the server, which is what the chaos buttons actually take away. Demo apparatus, like the rest
  # of the monitoring stack: nothing in the service depends on it.
  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: playhead-redis-exporter
    command: ["--redis.addr=redis://redis:6379"]
    ports:
      - "9121:9121"
    depends_on:
      - redis
    mem_limit: 64m

  postgres:
    image: postgres:16
    container_name: playhead-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: playhead
      POSTGRES_USER: playhead
      POSTGRES_PASSWORD: playhead
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m

  # The application itself, containerised so it can be replicated. Deliberately has no
  # container_name and no published port: both are single-value settings, and `--scale app=N`
  # would collide on either the moment N > 1. Traffic reaches it only through nginx.
  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/playhead
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      # Repeats the Dockerfile's timezone flag because setting this key replaces that ENV rather
      # than adding to it, and dropping -Duser.timezone brings back the Asia/Calcutta connect
      # failure from D-021.
      #
      # MaxRAMPercentage matters once mem_limit is small. The JVM's default is 25% of the container
      # limit, so capping a replica at 768m silently left it a ~192m heap — enough to run, not
      # enough to survive a saturation test. The first run at this cap died with OutOfMemoryError
      # under load and reported 100% failures, which measured the heap setting rather than the
      # scaling behaviour. 75% gives ~576m and leaves headroom for the JVM's non-heap use.
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC -XX:MaxRAMPercentage=75"
      # PLAYHEAD_ADMISSION can override the per-tier rates when a replica is given less than the
      # whole host — see AdmissionControl. Not set here: this replica is uncapped, so the code's
      # defaults (measured in phase 2 on this hardware) are the right ones. It exists because the
      # correct rate is a property of the instance's resources, not of the code.
    depends_on:
      - kafka
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    # A `cpus: 1.0` cap was tried here, to bound each replica the way an orchestrator bounds a pod
    # so that replica count and aggregate capacity would move together. The idea is sound and it is
    # how Kubernetes actually runs pods, but it could not be measured on this hardware: four capped
    # replicas plus nginx's workers plus the datastores leave k6 and the kernel's network stack
    # short of cores, so the client fails faster than the extra replicas help. Scaling and
    # measurement cannot share one machine. Reverted rather than left in, because the cap only
    # existed to enable that measurement and it makes the single-replica numbers worse than the
    # ones BENCHMARKS.md reports.
    mem_limit: 1.5g

  # The load balancer. Every client talks to this one address; it spreads requests across whatever
  # app replicas currently exist. Without it, replicas would be unreachable — they publish no port.
  nginx:
    image: nginx:1.27-alpine
    container_name: playhead-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    # 64m was sized when nginx ran its default single worker. Setting worker_processes auto gives
    # one worker per core, and 12 workers with a 16k-connection budget each do not fit in 64 MB:
    # the kernel OOM-killed 273 of them in a single run, which surfaced to clients as connection
    # failures and to nginx's log as "upstream timed out while connecting". Raised to match what
    # the worker count actually needs.
    mem_limit: 512m

  # NFR-11: latency percentiles, errors, consumer lag, cache hit rate, one dashboard, screenshotted
  # under a live surge for the README. Scrapes the app's Actuator /actuator/prometheus endpoint.
  # Config lives under demo/ with the rest of the demo harness — none of it is part of the service.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: playhead-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./demo/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    mem_limit: 512m

  grafana:
    image: grafana/grafana:11.3.1
    container_name: playhead-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: playhead
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      # The demo control panel embeds these dashboards in an iframe. Without both of these Grafana
      # sends X-Frame-Options and the panel shows an empty box instead of the graphs.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: none
    volumes:
      - ./demo/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    mem_limit: 256m

volumes:
  postgres-data:
